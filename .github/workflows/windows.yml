name: Windows build

on:
  push:
    branches: [main, windows-build]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: paper-rs-windows-x64
          path: |
            target/release/paper-rs.exe
            target/release/paper-rs-mcp.exe
